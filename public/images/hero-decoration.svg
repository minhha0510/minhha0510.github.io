<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Abstract molecular/network pattern representing research connections -->
  <!-- Central node -->
  <circle cx="80" cy="80" r="8" fill="currentColor" opacity="0.15"/>
  <circle cx="80" cy="80" r="4" fill="currentColor" opacity="0.3"/>

  <!-- Primary connections -->
  <line x1="80" y1="80" x2="40" y2="40" opacity="0.3"/>
  <line x1="80" y1="80" x2="120" y2="35" opacity="0.3"/>
  <line x1="80" y1="80" x2="130" y2="100" opacity="0.3"/>
  <line x1="80" y1="80" x2="45" y2="120" opacity="0.3"/>
  <line x1="80" y1="80" x2="110" y2="140" opacity="0.3"/>

  <!-- Secondary nodes -->
  <circle cx="40" cy="40" r="6" fill="currentColor" opacity="0.12"/>
  <circle cx="40" cy="40" r="3" fill="currentColor" opacity="0.25"/>

  <circle cx="120" cy="35" r="5" fill="currentColor" opacity="0.12"/>
  <circle cx="120" cy="35" r="2.5" fill="currentColor" opacity="0.25"/>

  <circle cx="130" cy="100" r="7" fill="currentColor" opacity="0.12"/>
  <circle cx="130" cy="100" r="3.5" fill="currentColor" opacity="0.25"/>

  <circle cx="45" cy="120" r="5" fill="currentColor" opacity="0.12"/>
  <circle cx="45" cy="120" r="2.5" fill="currentColor" opacity="0.25"/>

  <circle cx="110" cy="140" r="4" fill="currentColor" opacity="0.12"/>
  <circle cx="110" cy="140" r="2" fill="currentColor" opacity="0.25"/>

  <!-- Tertiary connections -->
  <line x1="40" y1="40" x2="20" y2="20" opacity="0.15"/>
  <line x1="40" y1="40" x2="15" y2="65" opacity="0.15"/>
  <line x1="120" y1="35" x2="145" y2="15" opacity="0.15"/>
  <line x1="130" y1="100" x2="150" y2="80" opacity="0.15"/>
  <line x1="130" y1="100" x2="148" y2="130" opacity="0.15"/>
  <line x1="45" y1="120" x2="20" y2="145" opacity="0.15"/>
  <line x1="110" y1="140" x2="130" y2="155" opacity="0.15"/>

  <!-- Tertiary nodes -->
  <circle cx="20" cy="20" r="2" fill="currentColor" opacity="0.15"/>
  <circle cx="15" cy="65" r="2.5" fill="currentColor" opacity="0.15"/>
  <circle cx="145" cy="15" r="2" fill="currentColor" opacity="0.15"/>
  <circle cx="150" cy="80" r="2" fill="currentColor" opacity="0.15"/>
  <circle cx="148" cy="130" r="2.5" fill="currentColor" opacity="0.15"/>
  <circle cx="20" cy="145" r="2" fill="currentColor" opacity="0.15"/>
  <circle cx="130" cy="155" r="2" fill="currentColor" opacity="0.15"/>

  <!-- Cross-connections between secondary nodes -->
  <line x1="40" y1="40" x2="120" y2="35" opacity="0.1" stroke-dasharray="3 3"/>
  <line x1="120" y1="35" x2="130" y2="100" opacity="0.1" stroke-dasharray="3 3"/>
  <line x1="45" y1="120" x2="110" y2="140" opacity="0.1" stroke-dasharray="3 3"/>
</svg>
